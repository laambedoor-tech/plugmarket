<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Pedidos — Plug Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/logo.svg" />
  <link rel="shortcut icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="bg-particles" aria-hidden="true"></canvas>

  <header class="nav">
    <a href="./index.html" class="brand">
      <img src="./assets/logo.svg" alt="Plug Market" class="brand__logo" />
      <span class="brand__name">Plug Market</span>
    </a>
    <nav class="menu">
      <a href="./index.html#home">Home</a>
      <a href="./index.html#products">Products</a>
      <a href="./index.html#faq">FAQ</a>
      <a href="./index.html#contact">Contact</a>
      <a href="./orders.html">Orders</a>
    </nav>
    <div class="cta">
      <a class="btn btn--ghost" href="./index.html#products">Continue shopping</a>
      <a class="cart-link" href="./cart.html" aria-label="Cart">
        <img src="./assets/cart.svg" alt="Cart" class="cart-link__icon" />
        <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
  </header>

  <main class="cart" style="position:relative; z-index:1;">
    <section style="padding:28px 24px; max-width: 1100px; margin:0 auto;">
      <h1 class="section-title" style="text-align:left;">Mis Pedidos</h1>
        
        <!-- Login form -->
        <div id="login-panel" class="card" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
          <h2 style="margin-top: 0; font-size: 1.5rem;">Accede a tus pedidos</h2>
          <p style="color: var(--text-500); margin-bottom: 1.5rem;">
            Ingresa el email que usaste al comprar para ver todos tus pedidos y credenciales.
          </p>
          <form id="login-form">
            <div style="margin-bottom: 1rem;">
              <label for="login-email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
              <input 
                type="email" 
                id="login-email" 
                style="
                  width: 100%;
                  padding: 0.75rem;
                  border: 1px solid var(--border);
                  border-radius: 8px;
                  background: var(--card-bg);
                  color: var(--text);
                  font-size: 1rem;
                " 
                placeholder="tu@email.com" 
                required 
                autocomplete="email"
              />
            </div>
            <div id="login-message" style="display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem;"></div>
            <button type="submit" class="btn btn--primary" style="width: 100%;">
              Ver mis pedidos
            </button>
          </form>
        </div>

        <!-- Orders list -->
        <div id="orders-panel" style="display: none;">
          <div class="card" style="padding: 1.5rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <h2 id="orders-email" style="margin: 0; font-size: 1.25rem;"></h2>
            <button id="btn-logout" class="btn btn--ghost btn--sm">Cerrar sesión</button>
          </div>

          <div id="orders-empty" style="display: none;" class="card">
            <div style="text-align: center; padding: 3rem;">
              <p style="color: var(--text-500); font-size: 1.1rem; margin-bottom: 1.5rem;">
                No tienes pedidos todavía.
              </p>
              <a href="./index.html#products" class="btn btn--primary">
                Ir a la tienda
              </a>
            </div>
          </div>

          <div id="orders-list"></div>
        </div>
      </section>
    </main>

    <script src="./js/main.js" type="module"></script>
    <script src="./js/orders.js" type="module"></script>
  </body>
</html>
