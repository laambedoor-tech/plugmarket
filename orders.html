<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17767889322"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'AW-17767889322');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Plug Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/logo.svg" />
  <link rel="shortcut icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <canvas id="bg-particles" aria-hidden="true"></canvas>

  <header class="nav">
    <a href="./index.html" class="brand">
      <img src="./assets/logo.svg" alt="Plug Market" class="brand__logo" />
      <span class="brand__name">Plug Market</span>
    </a>
    <nav class="menu">
      <a href="./index.html#home">Home</a>
      <a href="./index.html#products">Products</a>
      <a href="./index.html#faq">FAQ</a>
      <a href="./index.html#contact">Contact</a>
      <a href="./orders.html">Orders</a>
    </nav>
    <div class="cta">
      <a class="btn btn--ghost btn--desktop-only" href="./index.html#products">Continue shopping</a>
      <a class="cart-link" href="./cart.html" aria-label="Cart">
        <img src="./assets/cart.svg" alt="Cart" class="cart-link__icon" />
        <span class="cart-count" id="cart-count">0</span>
      </a>
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Mobile Sidebar Menu -->
  <div class="mobile-sidebar" id="mobile-sidebar">
    <div class="mobile-sidebar__overlay" id="mobile-sidebar-overlay"></div>
    <nav class="mobile-sidebar__panel">
      <div class="mobile-sidebar__header">
        <span class="mobile-sidebar__title">Menu</span>
        <button class="mobile-sidebar__close" id="mobile-sidebar-close" aria-label="Close menu">✕</button>
      </div>
      <div class="mobile-sidebar__content">
        <a href="./index.html#home" class="mobile-sidebar__link">Home</a>
        <a href="./index.html#products" class="mobile-sidebar__link">Products</a>
        <a href="./index.html#faq" class="mobile-sidebar__link">FAQ</a>
        <a href="./index.html#contact" class="mobile-sidebar__link">Contact</a>
        <a href="./orders.html" class="mobile-sidebar__link">Orders</a>
        <div class="mobile-sidebar__divider"></div>
        <a href="https://discord.gg/VCMbpaqX" target="_blank" rel="noopener noreferrer"
          class="mobile-sidebar__link mobile-sidebar__link--discord">
          Join Discord
        </a>
      </div>
    </nav>
  </div>

  <main class="cart" style="position:relative; z-index:1;">
    <section style="padding:28px 24px; max-width: 1100px; margin:0 auto;">
      <h1 class="section-title" style="text-align:left;">My Orders</h1>

      <!-- Login form -->
      <div id="login-panel" class="card" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
        <h2 style="margin-top: 0; font-size: 1.5rem;">Access your orders</h2>
        <p style="color: var(--text-500); margin-bottom: 1.5rem;">
          Enter the email you used when purchasing to see all your orders and credentials.
        </p>
        <form id="login-form">
          <div style="margin-bottom: 1rem;">
            <label for="login-email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
            <input type="email" id="login-email" style="
                  width: 100%;
                  padding: 0.75rem;
                  border: 1px solid var(--border);
                  border-radius: 8px;
                  background: var(--card-bg);
                  color: var(--text);
                  font-size: 1rem;
                " placeholder="your@email.com" required autocomplete="email" />
          </div>
          <div id="login-message" style="display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem;">
          </div>
          <button type="submit" class="btn btn--primary" style="width: 100%;">
            View my orders
          </button>
        </form>
      </div>

      <!-- Orders list -->
      <div id="orders-panel" style="display: none;">
        <div class="card"
          style="padding: 1.5rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
          <h2 id="orders-email" style="margin: 0; font-size: 1.25rem;"></h2>
          <button id="btn-logout" class="btn btn--ghost btn--sm">Logout</button>
        </div>

        <div id="orders-empty" style="display: none;" class="card">
          <div style="text-align: center; padding: 3rem;">
            <p style="color: var(--text-500); font-size: 1.1rem; margin-bottom: 1.5rem;">
              You don't have any orders yet.
            </p>
            <a href="./index.html#products" class="btn btn--primary">
              Go to store
            </a>
          </div>
        </div>

        <div id="orders-list"></div>
      </div>
    </section>
  </main>

  <script src="./js/main.js" type="module"></script>
  <script src="./js/orders.js" type="module"></script>
</body>

</html>
