  <style>
    body { background: #0b0b0c; }
    .reviews-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 32px auto 0; max-width: 1240px; }
    @media (max-width: 1024px) { .reviews-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 680px) { .reviews-grid { grid-template-columns: 1fr; } }
    .review-card { background: var(--card, #17181d); border-radius: 14px; border: 1px solid var(--border, #262730); box-shadow: 0 4px 18px rgba(0,0,0,.4); padding: 18px 16px 14px; color: #fff; display: flex; flex-direction: column; min-height: 160px; }
    .review-stars { color: #ff2743; font-size: 18px; margin-bottom: 6px; }
    .review-date { color: #9aa0ad; font-size: 13px; margin-bottom: 4px; }
    .review-product { color: #ff8a65; font-size: 13px; margin-top: 10px; }
    .review-message { font-size: 15px; margin-bottom: 8px; }
    .pagination { display: flex; justify-content: center; gap: 8px; margin: 32px 0 24px; }
    .pagination button { background: #17181d; color: #fff; border: 1px solid #262730; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
    .pagination button.active { background: linear-gradient(135deg, #ff2743, #ff5f6d); color: #fff; border: none; }
  </style>

const perPage = 24;
let page = 1;
function renderReviews() {
  const grid = document.getElementById('reviews-grid');
  grid.innerHTML = '';
  const start = (page-1)*perPage;
  const end = start+perPage;
  reviews.slice(start, end).forEach(r => {
    grid.innerHTML += `<div class="review-card">
      <div class="review-stars">${'★'.repeat(r.stars)}${r.stars===4?'☆':''}</div>
      <div class="review-date">${r.date}</div>
      <div class="review-message">${r.message}</div>
      <div class="review-product">${r.product}</div>
    </div>`;
  });
  // Pagination
  const totalPages = Math.ceil(reviews.length/perPage);
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  for (let i=1; i<=totalPages; i++) {
    pag.innerHTML += `<button class="${i===page?'active':''}" onclick="page=${i};renderReviews()">${i}</button>`;
  }
}
