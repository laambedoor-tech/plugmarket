<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plug Market — Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/logo.svg" />
  <link rel="shortcut icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <header class="nav">
      <a href="./index.html" class="brand">
        <img src="./assets/logo.svg" alt="Plug Market" class="brand__logo" />
        <span class="brand__name">Plug Market</span>
      </a>
      <nav class="menu">
        <a href="./index.html#home">Home</a>
        <a href="./index.html#products">Products</a>
        <a href="./index.html#faq">FAQ</a>
        <a href="./index.html#contact">Contact</a>
      </nav>
      <div class="cta">
        <a class="btn btn--ghost" href="./index.html#products">Continue shopping</a>
        <a class="cart-link" href="./cart.html" aria-label="Cart">
          <img src="./assets/cart.svg" alt="Cart" class="cart-link__icon" />
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </div>
    </header>

    <main class="cart" style="position:relative; z-index:1;">
      <section style="padding:28px 24px; max-width: 1100px; margin:0 auto;">
        <h1 class="section-title" style="text-align:left;">Your cart</h1>

        <div class="card" style="padding:0; overflow:hidden;">
          <div id="cart-empty" style="display:none; padding:24px; color:var(--text-500);">Your cart is empty.</div>
          <div id="cart-items"></div>
        </div>

        <div class="card" style="margin-top:16px; display:grid; grid-template-columns: 1fr auto; gap:12px; align-items:center;">
          <div class="muted">Taxes calculated at checkout. Prices in USD.</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <div style="font-weight:800;">Subtotal: <span id="cart-subtotal">$0.00</span></div>
            <a class="btn btn--ghost" id="btn-clear">Clear</a>
            <a class="btn btn--primary" id="btn-checkout">Checkout</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" id="contact">
      <div class="footer__grid">
        <div class="footer__brand">
          <img src="./assets/logo.svg" alt="Plug Market" />
          <p class="muted">Plug Market © 2025</p>
        </div>
  <nav class="footer__links">
          <a href="#">Terms</a>
          <a href="#">Privacy</a>
          <a href="https://discord.gg/3GRtH6msrb" target="_blank" rel="noopener">Discord</a>
          <a href="#">Telegram</a>
        </nav>
      </div>
    </footer>

    <script src="./js/main.js" type="module"></script>
    <script src="./js/cart.js" type="module"></script>
  </body>
</html>
