<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Debug Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .product {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .variant {
            margin: 5px 0;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #3498db;
        }
        .variant.in-stock {
            border-left-color: #27ae60;
        }
        .variant.out-of-stock {
            border-left-color: #e74c3c;
        }
        .variant.missing {
            border-left-color: #f39c12;
            background: #fef9e7;
        }
        .stock-count {
            font-weight: bold;
            float: right;
        }
        .stock-count.in { color: #27ae60; }
        .stock-count.out { color: #e74c3c; }
        .stock-count.missing { color: #f39c12; }
        .api-keys {
            margin-top: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }
        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background: #2980b9;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
            }

            h1 {
                font-size: 20px;
            }

            .api-keys {
                word-break: break-all;
                font-size: 11px;
            }

            .stock-count {
                float: none;
                display: block;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Stock Debug Dashboard</h1>
        <button class="refresh-btn" onclick="loadStockData()">🔄 Refresh Stock Data</button>
        
        <div id="products-container">
            <p>Loading stock data...</p>
        </div>
        
        <div class="api-keys">
            <strong>Stock API Keys:</strong>
            <div id="api-keys">Loading...</div>
        </div>
    </div>

    <script>
        // API Base
        const API_BASE = 'https://plugmarket.es';
        
        // All products and their expected variants
        const products = [
            {
                id: 'netflix',
                title: 'Netflix',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months', 'Lifetime', 'Bulk']
            },
            {
                id: 'spotify',
                title: 'Spotify Premium',
                variants: ['1 Month', '3 Months', '12 Months']
            },
            {
                id: 'youtube-premium',
                title: 'YouTube Premium',
                variants: ['1 Month', '6 Months', '12 Months']
            },
            {
                id: 'disney',
                title: 'Disney+',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months']
            },
            {
                id: 'prime',
                title: 'Amazon Prime Video',
                variants: ['1 Month', '3 Months', '12 Months']
            },
            {
                id: 'hbomax',
                title: 'HBO Max',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months', 'Lifetime']
            },
            {
                id: 'crunchyroll',
                title: 'Crunchyroll',
                apiId: 'crunchy',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months']
            },
            {
                id: 'nordvpn',
                title: 'NordVPN',
                variants: ['3 Months', '6 Months', '12 Months']
            },
            {
                id: 'chatgpt',
                title: 'ChatGPT Plus',
                apiId: 'chatgpt-pro',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months']
            },
            {
                id: 'filmora',
                title: 'Filmora',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months']
            },
            {
                id: 'steamaccount',
                title: 'Steam Account',
                variants: ['Random Games']
            },
            {
                id: 'geoguessr',
                title: 'GeoGuessr',
                variants: ['1 Month', '3 Months', '12 Months']
            },
            {
                id: 'duolingo',
                title: 'Duolingo Plus',
                variants: ['12 Months']
            },
            {
                id: 'movistar',
                title: 'Movistar+',
                variants: ['12 Months']
            },
            {
                id: 'dazn',
                title: 'DAZN',
                variants: ['Lifetime']
            },
            {
                id: 'realmembers',
                title: 'Realm Members',
                variants: ['[500]', '[1000]', '[2000]', '[3000]']
            },
            {
                id: 'capcut',
                title: 'CapCut Pro',
                variants: ['1 Month', '3 Months', '6 Months', '12 Months']
            },
            {
                id: 'nitro',
                title: 'Discord Nitro',
                variants: ['Boost 1m', 'Boost 1 Year', 'Basic 1m']
            },
            {
                id: 'discordpromocode',
                title: 'Discord Promo Code',
                variants: ['1 Month']
            }
        ];

        let stockData = {};

        async function loadStockData() {
            try {
                const response = await fetch(`${API_BASE}/api/get-stock`);
                const data = await response.json();
                stockData = data.stock || {};
                
                displayStockData();
                displayApiKeys();
            } catch (error) {
                console.error('Error fetching stock data:', error);
                document.getElementById('products-container').innerHTML = 
                    `<p style="color: red;">Error loading stock data: ${error.message}</p>`;
            }
        }

        function displayStockData() {
            const container = document.getElementById('products-container');
            let html = '';

            products.forEach(product => {
                const apiId = product.apiId || product.id;
                
                html += `<div class="product">
                    <div class="product-title">${product.title} (${product.id})</div>`;

                product.variants.forEach(variant => {
                    const stockKey = `${apiId}:${variant}`;
                    const stock = stockData[stockKey];
                    
                    let className = 'variant';
                    let stockText = '';
                    
                    if (stock === undefined) {
                        className += ' missing';
                        stockText = '<span class="stock-count missing">MISSING FROM API</span>';
                    } else if (stock > 0) {
                        className += ' in-stock';
                        stockText = `<span class="stock-count in">${stock} units</span>`;
                    } else {
                        className += ' out-of-stock';
                        stockText = '<span class="stock-count out">0 units</span>';
                    }
                    
                    html += `<div class="${className}">
                        ${variant} → ${stockKey} ${stockText}
                    </div>`;
                });

                html += '</div>';
            });

            container.innerHTML = html;
        }

        function displayApiKeys() {
            const apiKeys = Object.keys(stockData).sort();
            const keysContainer = document.getElementById('api-keys');
            keysContainer.innerHTML = apiKeys.join('<br>');
        }

        // Load data on page load
        loadStockData();
    </script>
</body>
</html>
