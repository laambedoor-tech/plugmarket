<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Verification</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: #1a1b24;
      color: #d7d9e0;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #ff2743;
      margin-bottom: 20px;
    }
    .section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      color: #4da3ff;
      font-size: 18px;
      margin-bottom: 15px;
    }
    pre {
      background: #0d0e12;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .loading {
      color: #ffab40;
    }
    .error {
      color: #ff6b6b;
    }
    .success {
      color: #2ed573;
    }
    button {
      background: linear-gradient(135deg, #ff2743, #ff5f6d);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(255, 39, 67, 0.4);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    th {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-weight: 600;
    }
    .stock-key {
      color: #4da3ff;
      font-weight: 600;
    }
    .stock-count {
      color: #2ed573;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>📊 Netflix Stock Verification</h1>
  
  <button onclick="checkStock()">🔄 Check Stock</button>
  
  <div class="section">
    <h2>Status</h2>
    <div id="status" class="loading">Click button to check stock...</div>
  </div>

  <div class="section" id="netflix-section" style="display: none;">
    <h2>Netflix Accounts in Database</h2>
    <div id="netflix-content"></div>
  </div>

  <div class="section" id="available-section" style="display: none;">
    <h2>All Available Stock (by product:plan)</h2>
    <div id="available-content"></div>
  </div>

  <div class="section" id="raw-section" style="display: none;">
    <h2>Raw Response</h2>
    <pre id="raw-content"></pre>
  </div>

  <script>
    async function checkStock() {
      const statusEl = document.getElementById('status');
      statusEl.innerHTML = '<span class="loading">⏳ Loading data from database...</span>';
      
      // Hide sections
      document.getElementById('netflix-section').style.display = 'none';
      document.getElementById('available-section').style.display = 'none';
      document.getElementById('raw-section').style.display = 'none';

      try {
        // Try production API first
        let response = await fetch('https://plugmarket.es/api/test-netflix-stock');
        
        // If production fails, try local
        if (!response.ok) {
          response = await fetch('http://localhost:8788/api/test-netflix-stock');
        }

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        
        statusEl.innerHTML = '<span class="success">✅ Data loaded successfully!</span>';
        
        // Show Netflix section
        if (data.netflix) {
          document.getElementById('netflix-section').style.display = 'block';
          const netflixEl = document.getElementById('netflix-content');
          
          let html = `<p><strong>Total Netflix accounts:</strong> ${data.netflix.total}</p>`;
          
          if (data.netflix.total > 0) {
            html += '<h3>Accounts by Plan and Status:</h3><table>';
            html += '<tr><th>Plan (Status)</th><th>Count</th></tr>';
            
            for (const [key, count] of Object.entries(data.netflix.byPlan)) {
              html += `<tr><td class="stock-key">${key}</td><td class="stock-count">${count}</td></tr>`;
            }
            html += '</table>';
            
            if (data.netflix.sample && data.netflix.sample.length > 0) {
              html += '<h3>Sample Data:</h3><table>';
              html += '<tr><th>ID</th><th>Product ID</th><th>Plan</th><th>Status</th></tr>';
              data.netflix.sample.forEach(acc => {
                html += `<tr>
                  <td>${acc.id}</td>
                  <td>${acc.product_id}</td>
                  <td class="stock-key">${acc.plan}</td>
                  <td>${acc.status}</td>
                </tr>`;
              });
              html += '</table>';
            }
          } else {
            html += '<p class="error">⚠️ No Netflix accounts found in database</p>';
          }
          
          netflixEl.innerHTML = html;
        }

        // Show available section
        if (data.allAvailable) {
          document.getElementById('available-section').style.display = 'block';
          const availableEl = document.getElementById('available-content');
          
          let html = `<p><strong>Total available accounts:</strong> ${data.allAvailable.total}</p>`;
          
          if (Object.keys(data.allAvailable.byProductPlan).length > 0) {
            html += '<h3>Available Stock:</h3><table>';
            html += '<tr><th>Product:Plan</th><th>Available Count</th></tr>';
            
            for (const [key, count] of Object.entries(data.allAvailable.byProductPlan)) {
              html += `<tr><td class="stock-key">${key}</td><td class="stock-count">${count}</td></tr>`;
            }
            html += '</table>';
          } else {
            html += '<p class="error">⚠️ No available accounts found</p>';
          }
          
          availableEl.innerHTML = html;
        }

        // Show raw response
        document.getElementById('raw-section').style.display = 'block';
        document.getElementById('raw-content').textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        statusEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
        console.error('Error checking stock:', error);
      }
    }

    // Auto-load on page load
    window.addEventListener('load', () => {
      setTimeout(checkStock, 500);
    });
  </script>
</body>
</html>
