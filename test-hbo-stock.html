<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBO Max Stock Test</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    pre {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
    button {
      background: #ff2743;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #ff5f6d;
    }
    .result {
      margin: 20px 0;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    .success { border-left: 4px solid #2ed573; }
    .error { border-left: 4px solid #ff6b6b; }
    .warning { border-left: 4px solid #ffa502; }
  </style>
</head>
<body>
  <h1>🔍 HBO Max Stock Diagnostic</h1>
  
  <div>
    <button onclick="checkStock()">Check Stock API</button>
    <button onclick="checkSpecificStock()">Check HBO Max Stock Only</button>
    <button onclick="clearResults()">Clear Results</button>
  </div>

  <div id="results"></div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname.includes('192.168')
      ? 'http://localhost:8788'
      : 'https://plugmarket.es';

    function addResult(type, title, content) {
      const resultsDiv = document.getElementById('results');
      const resultDiv = document.createElement('div');
      resultDiv.className = `result ${type}`;
      resultDiv.innerHTML = `
        <h3>${title}</h3>
        <pre>${typeof content === 'object' ? JSON.stringify(content, null, 2) : content}</pre>
      `;
      resultsDiv.appendChild(resultDiv);
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
    }

    async function checkStock() {
      clearResults();
      addResult('warning', '⏳ Fetching stock...', 'Please wait...');
      
      try {
        const res = await fetch(`${API_BASE}/api/get-stock`);
        const data = await res.json();
        
        clearResults();
        
        if (res.ok) {
          addResult('success', '✅ Stock API Response', data);
          
          // Check for HBO Max specifically
          const hboKeys = Object.keys(data.stock || {}).filter(k => k.includes('hbomax'));
          if (hboKeys.length > 0) {
            addResult('success', '🎬 HBO Max Stock Found', {
              keys: hboKeys,
              stock: hboKeys.reduce((acc, key) => {
                acc[key] = data.stock[key];
                return acc;
              }, {})
            });
          } else {
            addResult('error', '❌ HBO Max Stock NOT Found', 
              'No keys found with "hbomax" in the stock response. Check if accounts are added in Supabase with:\n\n' +
              'product_id = "hbomax"\n' +
              'plan = "Lifetime"\n' +
              'status = "available"'
            );
          }
        } else {
          addResult('error', '❌ API Error', data);
        }
      } catch (err) {
        clearResults();
        addResult('error', '❌ Network Error', err.message);
      }
    }

    async function checkSpecificStock() {
      clearResults();
      addResult('warning', '⏳ Checking HBO Max stock...', 'Please wait...');
      
      try {
        const res = await fetch(`${API_BASE}/api/get-stock`);
        const data = await res.json();
        
        clearResults();
        
        if (res.ok) {
          const stockData = data.stock || {};
          
          // Check all possible keys
          const keys = [
            'hbomax:Lifetime',
            'hbomax:lifetime',
            'hbomax',
          ];
          
          let found = false;
          for (const key of keys) {
            if (stockData[key] !== undefined) {
              addResult('success', `✅ Stock Found with key: "${key}"`, {
                key: key,
                stock: stockData[key],
                message: stockData[key] > 0 ? '✓ IN STOCK' : '✗ OUT OF STOCK'
              });
              found = true;
            }
          }
          
          if (!found) {
            addResult('error', '❌ HBO Max Stock Not Found', 
              'Tried these keys:\n' + keys.map(k => `  - ${k}`).join('\n') + '\n\n' +
              'Available keys in response:\n' + Object.keys(stockData).map(k => `  - ${k}`).join('\n') + '\n\n' +
              'To add HBO Max stock, run this in Supabase SQL Editor:\n\n' +
              'INSERT INTO accounts (email, password, product_id, plan, status, created_at)\n' +
              'VALUES (\'kv09222020@gmail.com\', \'Kv09222020$\', \'hbomax\', \'Lifetime\', \'available\', NOW());'
            );
          }
        } else {
          addResult('error', '❌ API Error', data);
        }
      } catch (err) {
        clearResults();
        addResult('error', '❌ Network Error', err.message);
      }
    }

    // Auto-check on load
    checkSpecificStock();
  </script>
</body>
</html>
